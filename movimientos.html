<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Il Mattarello — Historial</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page--movimientos">
  <header class="header">
    <h1 class="header__title">Historial de Movimientos</h1>
    <p class="header__subtitle">Ingresos y egresos del bodegón</p>
  </header>

  <nav class="nav">
    <ul class="nav__list">
      <li class="nav__item"><a class="nav__link" href="index.html">Dashboard</a></li>
      <li class="nav__item"><a class="nav__link" href="inventario.html">Stock</a></li>
      <li class="nav__item"><a class="nav__link" href="perfil.html">Ficha</a></li>
      <li class="nav__item"><a class="nav__link" href="configuracion.html">Configuración</a></li>
      <li class="nav__item"><a class="nav__link" href="calendario.html">Calendario</a></li>
      <li class="nav__item"><a class="nav__link" href="reservas.html">Reservas</a></li>
      <li class="nav__item"><a class="nav__link nav__link--active" href="movimientos.html">Historial</a></li>
      <li class="nav__item"><a class="nav__link" href="galeria.html">Galería</a></li>
    </ul>
  </nav>

  <main class="main">
    <section class="toolbar">
      <input type="search" id="buscador-mov" placeholder="Buscar por concepto..." />
      <select id="filtro-tipo" class="form__input">
        <option value="">Todos</option>
        <option value="ingreso">Ingresos</option>
        <option value="egreso">Egresos</option>
      </select>
    </section>

    <div class="tabla-wrapper">
      <table>
        <thead>
          <tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Monto</th></tr>
        </thead>
        <tbody id="mov-tbody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const movimientos = [
      { fecha: "2026-05-01", concepto: "Venta del día", tipo: "ingreso", monto: 245300 },
      { fecha: "2026-05-01", concepto: "Compra de harina", tipo: "egreso", monto: 18500 },
      { fecha: "2026-05-02", concepto: "Venta del día", tipo: "ingreso", monto: 198400 },
      { fecha: "2026-05-02", concepto: "Pago de gas", tipo: "egreso", monto: 42000 },
      { fecha: "2026-05-03", concepto: "Venta del día", tipo: "ingreso", monto: 312700 },
      { fecha: "2026-05-03", concepto: "Sueldos mozos",  tipo: "egreso", monto: 180000 },
    ];
    const tbody = document.getElementById("mov-tbody");
    const buscador = document.getElementById("buscador-mov");
    const filtro = document.getElementById("filtro-tipo");

    function fmt(n){ return "$ " + n.toLocaleString("es-AR"); }
    function render() {
      const q = buscador.value.toLowerCase();
      const t = filtro.value;
      tbody.innerHTML = movimientos
        .filter(m => m.concepto.toLowerCase().includes(q) && (!t || m.tipo === t))
        .map(m => `
          <tr>
            <td>${m.fecha}</td>
            <td>${m.concepto}</td>
            <td><span class="badge badge--${m.tipo === 'ingreso' ? 'ok' : 'bajo'}">${m.tipo}</span></td>
            <td>${fmt(m.monto)}</td>
          </tr>`).join("");
    }
    buscador.oninput = render;
    filtro.onchange = render;
    render();
  </script>
</body>
</html>
