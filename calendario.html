<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Il Mattarello — Calendario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page--calendario">
  <header class="header">
    <h1 class="header__title">Calendario de Eventos</h1>
    <p class="header__subtitle">Agenda mensual del bodegón</p>
  </header>

  <nav class="nav">
    <ul class="nav__list">
      <li class="nav__item"><a class="nav__link" href="index.html">Dashboard</a></li>
      <li class="nav__item"><a class="nav__link" href="inventario.html">Stock</a></li>
      <li class="nav__item"><a class="nav__link" href="perfil.html">Ficha</a></li>
      <li class="nav__item"><a class="nav__link" href="configuracion.html">Configuración</a></li>
      <li class="nav__item"><a class="nav__link nav__link--active" href="calendario.html">Calendario</a></li>
      <li class="nav__item"><a class="nav__link" href="reservas.html">Reservas</a></li>
      <li class="nav__item"><a class="nav__link" href="movimientos.html">Historial</a></li>
      <li class="nav__item"><a class="nav__link" href="galeria.html">Galería</a></li>
    </ul>
  </nav>

  <main class="main">
    <section class="calendario">
      <div class="calendario__toolbar">
        <button class="btn btn--secondary" id="btn-prev">‹ Anterior</button>
        <h2 class="calendario__titulo" id="calendario-titulo"></h2>
        <button class="btn btn--secondary" id="btn-next">Siguiente ›</button>
      </div>
      <div class="calendario__grid" id="calendario-grid"></div>
      <div class="calendario__leyenda">
        <span class="badge badge--ok">Evento</span>
        <span class="badge badge--bajo">Reserva privada</span>
      </div>
    </section>
  </main>

  <script>
    const eventos = {
      5: { tipo: "ok", titulo: "Noche de Tango" },
      12: { tipo: "bajo", titulo: "Cumpleaños privado" },
      18: { tipo: "ok", titulo: "Cata de Malbec" },
      25: { tipo: "ok", titulo: "Menú Degustación" },
    };

    const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const dias = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
    let cursor = new Date();
    cursor.setDate(1);

    function render() {
      document.getElementById("calendario-titulo").textContent = `${meses[cursor.getMonth()]} ${cursor.getFullYear()}`;
      const grid = document.getElementById("calendario-grid");
      grid.innerHTML = "";
      dias.forEach(d => grid.insertAdjacentHTML("beforeend", `<div class="calendario__dia-header">${d}</div>`));
      const first = (new Date(cursor.getFullYear(), cursor.getMonth(), 1).getDay() + 6) % 7;
      const last = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
      for (let i=0; i<first; i++) grid.insertAdjacentHTML("beforeend", `<div class="calendario__dia calendario__dia--vacio"></div>`);
      for (let d=1; d<=last; d++) {
        const ev = eventos[d];
        grid.insertAdjacentHTML("beforeend", `
          <div class="calendario__dia ${ev ? 'calendario__dia--evento' : ''}">
            <span class="calendario__numero">${d}</span>
            ${ev ? `<span class="badge badge--${ev.tipo}">${ev.titulo}</span>` : ""}
          </div>`);
      }
    }
    document.getElementById("btn-prev").onclick = () => { cursor.setMonth(cursor.getMonth()-1); render(); };
    document.getElementById("btn-next").onclick = () => { cursor.setMonth(cursor.getMonth()+1); render(); };
    render();
  </script>
</body>
</html>
