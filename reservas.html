<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Il Mattarello — Reservas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page--reservas">
  <header class="header">
    <h1 class="header__title">Reservas</h1>
    <p class="header__subtitle">Gestión de mesas reservadas</p>
  </header>

  <nav class="nav">
    <ul class="nav__list">
      <li class="nav__item"><a class="nav__link" href="index.html">Dashboard</a></li>
      <li class="nav__item"><a class="nav__link" href="inventario.html">Stock</a></li>
      <li class="nav__item"><a class="nav__link" href="perfil.html">Ficha</a></li>
      <li class="nav__item"><a class="nav__link" href="configuracion.html">Configuración</a></li>
      <li class="nav__item"><a class="nav__link" href="calendario.html">Calendario</a></li>
      <li class="nav__item"><a class="nav__link nav__link--active" href="reservas.html">Reservas</a></li>
      <li class="nav__item"><a class="nav__link" href="movimientos.html">Historial</a></li>
      <li class="nav__item"><a class="nav__link" href="galeria.html">Galería</a></li>
    </ul>
  </nav>

  <main class="main">
    <section class="reservas">
      <form class="reservas__form" id="form-reserva">
        <input class="form__input" name="cliente" placeholder="Cliente" required />
        <input class="form__input" name="personas" type="number" min="1" placeholder="Personas" required />
        <input class="form__input" name="fecha" type="date" required />
        <input class="form__input" name="hora" type="time" required />
        <button type="submit" class="btn btn--primary">Reservar</button>
      </form>

      <div class="tabla-wrapper">
        <table>
          <thead>
            <tr><th>Cliente</th><th>Personas</th><th>Fecha</th><th>Hora</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody id="reservas-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const reservas = [
      { cliente: "Familia Rossi", personas: 4, fecha: "2026-05-05", hora: "21:00", estado: "ok" },
      { cliente: "M. Bianchi",    personas: 2, fecha: "2026-05-06", hora: "20:30", estado: "ok" },
      { cliente: "Empresa Acme",  personas: 12,fecha: "2026-05-08", hora: "22:00", estado: "bajo" },
    ];
    const tbody = document.getElementById("reservas-tbody");
    function render() {
      tbody.innerHTML = reservas.map((r,i) => `
        <tr>
          <td>${r.cliente}</td>
          <td>${r.personas}</td>
          <td>${r.fecha}</td>
          <td>${r.hora}</td>
          <td><span class="badge badge--${r.estado}">${r.estado === 'ok' ? 'Confirmada' : 'Pendiente'}</span></td>
          <td><button class="btn btn--danger" data-i="${i}">Cancelar</button></td>
        </tr>`).join("");
      tbody.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { reservas.splice(b.dataset.i,1); render(); });
    }
    render();
    document.getElementById("form-reserva").addEventListener("submit", e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      reservas.push({ cliente: fd.get("cliente"), personas: +fd.get("personas"), fecha: fd.get("fecha"), hora: fd.get("hora"), estado: "bajo" });
      e.target.reset();
      render();
    });
  </script>
</body>
</html>
