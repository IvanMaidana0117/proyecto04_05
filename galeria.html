<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Il Mattarello — Galería</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page--galeria">
  <header class="header">
    <h1 class="header__title">Galería</h1>
    <p class="header__subtitle">Platos y ambiente del bodegón</p>
  </header>

  <nav class="nav">
    <ul class="nav__list">
      <li class="nav__item"><a class="nav__link" href="index.html">Dashboard</a></li>
      <li class="nav__item"><a class="nav__link" href="inventario.html">Stock</a></li>
      <li class="nav__item"><a class="nav__link" href="perfil.html">Ficha</a></li>
      <li class="nav__item"><a class="nav__link" href="configuracion.html">Configuración</a></li>
      <li class="nav__item"><a class="nav__link" href="calendario.html">Calendario</a></li>
      <li class="nav__item"><a class="nav__link" href="reservas.html">Reservas</a></li>
      <li class="nav__item"><a class="nav__link" href="movimientos.html">Historial</a></li>
      <li class="nav__item"><a class="nav__link nav__link--active" href="galeria.html">Galería</a></li>
    </ul>
  </nav>

  <main class="main">
    <section class="toolbar">
      <label class="form__label" style="flex:1">Subir nueva foto
        <input type="file" id="input-foto" accept="image/*" multiple />
      </label>
    </section>

    <section class="galeria" id="galeria-grid">
      <figure class="galeria__item"><img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=600" alt="Pasta" /></figure>
      <figure class="galeria__item"><img src="https://images.unsplash.com/photo-1572441713132-c542fc4fe282?w=600" alt="Lasagna" /></figure>
      <figure class="galeria__item"><img src="https://images.unsplash.com/photo-1525755662778-989d0524087e?w=600" alt="Vino" /></figure>
      <figure class="galeria__item"><img src="https://images.unsplash.com/photo-1481931098730-318b6f776db0?w=600" alt="Salón" /></figure>
      <figure class="galeria__item"><img src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=600" alt="Plato" /></figure>
      <figure class="galeria__item"><img src="https://images.unsplash.com/photo-1546549032-9571cd6b27df?w=600" alt="Ravioles" /></figure>
    </section>
  </main>

  <script>
    const grid = document.getElementById("galeria-grid");
    document.getElementById("input-foto").addEventListener("change", e => {
      [...e.target.files].forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
          grid.insertAdjacentHTML("afterbegin",
            `<figure class="galeria__item"><img src="${ev.target.result}" alt="${file.name}" /></figure>`);
        };
        reader.readAsDataURL(file);
      });
    });
  </script>
</body>
</html>
